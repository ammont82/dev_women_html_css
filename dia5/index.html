<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="iphone-plus">
      <img class="image" src="img/image-2.png" />
      <div class="ellipse"></div>
      <div class="status-bar-white">
        <div class="frame"></div>
        <div class="status-bar">
          <div class="battery">
            <div class="border"></div>
            <img class="cap" src="img/cap.svg" />
            <div class="capacity"></div>
          </div>
          <img class="wifi" src="img/wifi.svg" />
          <img class="cellular-connection" src="img/cellular-connection.svg" />
          <div class="time-style">
            <div class="time-clipping-group"><div class="time">9:41</div></div>
          </div>
        </div>
      </div>
      <div class="rectangle"></div>
      <img class="img" src="img/image-8.png" />
      <div class="div"></div>
      <div class="rectangle-2"></div>
    </div>
  </body>
</html>
