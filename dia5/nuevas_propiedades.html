<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novedades CSS 2025 - Ejercicio</title>
<link rel="stylesheet" href="nuevas_propiedades.css" />
</head>
<body>

  <article class="card-container">
    <img class="card-img" src="https://picsum.photos/400/250" alt="Producto">
    <div>
      <h2>Descubre las nuevas funciones de CSS 2025</h2>
      <p>Este ejemplo usa <strong>container queries</strong>, <strong>text-wrap: balance</strong>, validación visual, y <strong>field-sizing</strong>.</p>
      <form>
        <label for="comentario">Tu opinión:</label>
        <textarea id="comentario" placeholder="Escribe algo..." required></textarea>
        <button type="submit">Enviar</button>
      </form>
    </div>
  </article>

</body>
</html>
