<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Login - Demo Fake</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Iniciar sesión</h1>

    <form id="loginForm" class="card">
      <label>
        Email
        <input type="email" id="email" required placeholder="ana@example.com" />
      </label>

      <label>
        Contraseña
        <input type="password" id="password" required placeholder="1234" />
      </label>

      <button type="submit">Entrar</button>

      <p id="message" class="message"></p>
    </form>

    <section id="profile" class="card hidden">
      <h2>Perfil</h2>
      <p id="profileContent"></p>
      <button id="logoutBtn">Cerrar sesión</button>
    </section>

    <aside class="tips card">
      <h3>Credenciales de prueba</h3>
      <ul>
        <li>ana@example.com / 1234</li>
        <li>lucia@example.com / abcd</li>
      </ul>
      <p>Abre la pestaña <strong>Network</strong> en DevTools para ver las peticiones.</p>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
